name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gate
        run: pnpm run ci

  release-candidate:
    name: Release candidate
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and verify one candidate tarball
        run: pnpm release:candidate -- --output "${RUNNER_TEMP}/sight-mcp-candidate"
        env:
          SOURCE_COMMIT: ${{ github.sha }}

      - name: Upload candidate, manifest, smoke record, and SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sight-mcp-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/sight-mcp-candidate/
          if-no-files-found: error
          retention-days: 14

  attest-release-candidate:
    name: Attest main candidate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: release-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download exact candidate from this workflow
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sight-mcp-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/sight-mcp-candidate

      - name: Attest tarball provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/sight-mcp-candidate/*.tgz
